<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Space Chicken" />
        <meta name="theme-color" content="#000000" />
        <meta name="format-detection" content="telephone=no" />
        <title>Space Chicken Game</title>
        <meta
            name="description"
            content="A chicken. A jetpack. Four cosmic obstacle courses. Jump, dodge, and chase the crown in Space Chicken."
        />
        <script src="./vendor/phaser-arcade-physics-3.70.0.min.js"></script>
        <style>
            :root {
                --safe-area-top: env(safe-area-inset-top, 0px);
                --safe-area-right: env(safe-area-inset-right, 0px);
                --safe-area-bottom: env(safe-area-inset-bottom, 0px);
                --safe-area-left: env(safe-area-inset-left, 0px);
            }
            html,
            body {
                width: 100%;
                height: 100%;
                height: 100svh;
                overflow: hidden;
                position: fixed;
                inset: 0;
            }
            body {
                margin: 0;
                padding: 0;
                background: #000;
                font-family: 'Trebuchet MS', 'Courier New', monospace;
                touch-action: none;
                overscroll-behavior: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            #phaser-game {
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                height: 100svh;
                touch-action: none;
                overflow: hidden;
            }
            #phaser-game canvas {
                display: block;
                touch-action: none;
            }
            .error {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: red;
                font-size: 20px;
                text-align: center;
                padding: 0 16px;
            }
            .game-button {
                min-height: 44px;
                padding: 10px 18px;
                border: 1px solid #8ca9db;
                border-radius: 12px;
                background: #14233e;
                color: #fff;
                font:
                    bold 16px 'Trebuchet MS',
                    sans-serif;
                cursor: pointer;
            }
            #race-setup-dialog button:focus,
            .game-button:focus-visible {
                outline: 3px solid #ffe566;
                outline-offset: 4px;
            }
            #pause-button {
                position: fixed;
                right: max(16px, env(safe-area-inset-right));
                top: 50%;
                z-index: 10;
                opacity: 0.85;
            }
            :is(#pause-dialog, #race-setup-dialog) {
                box-sizing: border-box;
                width: min(420px, calc(100% - 32px));
                padding: 24px;
                border: 1px solid #617dad;
                border-radius: 20px;
                background: #101b30;
                color: #dce7ff;
                text-align: center;
                line-height: 1.45;
                max-height: calc(
                    100svh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)
                );
                overflow-y: auto;
                touch-action: pan-y;
            }
            :is(#pause-dialog, #race-setup-dialog)::backdrop {
                background: #030918cc;
            }
            :is(#pause-dialog, #race-setup-dialog) h1 {
                color: #ffe566;
                margin-top: 0;
            }
            .pause-touch-help {
                display: none;
            }
            @media (pointer: coarse) {
                .pause-keyboard-help {
                    display: none;
                }
                .pause-touch-help {
                    display: block;
                }
            }
            @media (max-height: 500px) {
                :is(#pause-dialog, #race-setup-dialog) {
                    padding: 12px 20px;
                    line-height: 1.35;
                }
                :is(#pause-dialog, #race-setup-dialog) h1 {
                    font-size: 24px;
                    margin-bottom: 8px;
                }
                :is(#pause-dialog, #race-setup-dialog) p {
                    margin: 8px 0;
                }
            }
        </style>
    </head>
    <body>
        <div id="phaser-game"></div>
        <button id="pause-button" class="game-button" aria-label="Pause game (Escape or P)">
            Ⅱ
        </button>
        <dialog id="pause-dialog" aria-labelledby="pause-title">
            <h1 id="pause-title">Game paused</h1>
            <p>The timer is stopped.</p>
            <p class="pause-keyboard-help">
                Move: ← → or A / D · Jump: Space, ↑, or W<br />Press 2 for a split-screen race.
            </p>
            <p class="pause-touch-help">Use the arrows to move and JUMP to boost.</p>
            <button id="resume-button" class="game-button">Resume game</button>
        </dialog>
        <noscript><p class="error">Enable JavaScript to play Space Chicken.</p></noscript>
        <script type="module">
            import { attachPauseControls } from './PauseController.js';
            import { createGameConfig } from './GameConfig.js';
            function readViewportSize() {
                const visual = window.visualViewport;
                const width = Math.max(
                    1,
                    Math.round(visual && visual.width ? visual.width : window.innerWidth || 800)
                );
                const height = Math.max(
                    1,
                    Math.round(visual && visual.height ? visual.height : window.innerHeight || 600)
                );
                return { width, height };
            }

            function preventBrowserGestures() {
                const cancel = (event) => event.preventDefault();
                document.addEventListener('gesturestart', cancel);
                document.addEventListener('gesturechange', cancel);
                document.addEventListener('gestureend', cancel);
                document.addEventListener(
                    'dblclick',
                    (event) => {
                        event.preventDefault();
                    },
                    { passive: false }
                );
            }

            function attachViewportSync(game, parent) {
                const sync = () => {
                    const size = readViewportSize();
                    const visual = window.visualViewport;
                    parent.style.width = `${size.width}px`;
                    parent.style.height = `${size.height}px`;
                    parent.style.left = `${visual ? visual.offsetLeft || 0 : 0}px`;
                    parent.style.top = `${visual ? visual.offsetTop || 0 : 0}px`;
                    if (
                        game?.scale &&
                        (game.scale.width !== size.width || game.scale.height !== size.height)
                    ) {
                        game.scale.resize(size.width, size.height);
                    }
                };
                sync();
                window.addEventListener('resize', sync);
                window.addEventListener('orientationchange', sync);
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', sync);
                    window.visualViewport.addEventListener('scroll', sync);
                }
                return sync;
            }

            try {
                preventBrowserGestures();
                const parent = document.getElementById('phaser-game');
                const initialSize = readViewportSize();
                const { SpaceChicken } = await import('./SpaceChicken.js');
                const config = createGameConfig(initialSize, SpaceChicken);

                const game = new Phaser.Game(config);
                window.SPACE_CHICKEN_GAME = game;
                attachPauseControls(game);
                attachViewportSync(game, parent);
            } catch (error) {
                console.error('Failed to initialize game:', error);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = 'Space Chicken could not load. Please refresh to try again.';
                document.body.appendChild(errorDiv);
            }
        </script>
    </body>
</html>
