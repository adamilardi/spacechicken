<!doctype html>
<meta charset="utf-8" />
<title>Colony Drop A — preview (1x on black)</title>
<style>
    body {
        background: #000;
        color: #ddd;
        font-family: monospace;
    }
    canvas {
        image-rendering: pixelated;
        border: 1px solid #333;
        margin: 8px;
    }
</style>
<h1>level-colony-drop-a — Colony Drop beachhead</h1>
<p>
    background-layout (960x270) / platform deck (96x24) / prop beacon, decor only (24x44). Seam
    strip: bottom row repeats deck x6.
</p>
<canvas id="bg" width="960" height="270"></canvas>
<canvas id="deck" width="96" height="24"></canvas>
<canvas id="prop" width="24" height="44"></canvas>
<div><canvas id="strip" width="576" height="24"></canvas> seam strip</div>
<script type="module">
    import { paint as bg } from './layout.js';
    import { paint as deck } from './deck.js';
    import { paint as prop } from './beacon.js';
    bg(document.getElementById('bg').getContext('2d'), 960, 270);
    deck(document.getElementById('deck').getContext('2d'), 96, 24);
    prop(document.getElementById('prop').getContext('2d'), 24, 44);
    const s = document.getElementById('strip').getContext('2d');
    for (let i = 0; i < 6; i++) {
        s.save();
        s.translate(i * 96, 0);
        deck(s, 96, 24);
        s.restore();
    }
</script>
