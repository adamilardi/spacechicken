<!doctype html>
<meta charset="utf-8" />
<title>enemy-spire-warden-a — preview</title>
<style>
    body {
        font-family: monospace;
    }
    canvas {
        image-rendering: pixelated;
        border: 1px solid #333;
        margin: 8px;
    }
</style>
<h1>enemy-spire-warden-a (40x56)</h1>
<canvas id="b1" width="40" height="56" style="background: #000"></canvas>
<canvas id="w1" width="40" height="56" style="background: #fff"></canvas>
<canvas id="b3" width="120" height="168" style="background: #000"></canvas>
<canvas id="w3" width="120" height="168" style="background: #fff"></canvas>
<script type="module">
    import { paint } from './paint.js';
    for (const [id, s] of [
        ['b1', 1],
        ['w1', 1],
        ['b3', 3],
        ['w3', 3],
    ]) {
        const c = document.getElementById(id);
        const x = c.getContext('2d');
        x.scale(s, s);
        paint(x, 40, 56);
    }
</script>
