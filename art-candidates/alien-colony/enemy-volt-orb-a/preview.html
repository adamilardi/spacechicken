<!doctype html>
<meta charset="utf-8" />
<title>enemy-volt-orb-a — preview</title>
<style>
    body { font-family: monospace; }
    canvas { image-rendering: pixelated; border: 1px solid #333; margin: 8px; }
</style>
<h1>enemy-volt-orb-a (48x48)</h1>
<canvas id="b1" width="48" height="48" style="background: #000"></canvas>
<canvas id="w1" width="48" height="48" style="background: #fff"></canvas>
<canvas id="b3" width="144" height="144" style="background: #000"></canvas>
<canvas id="w3" width="144" height="144" style="background: #fff"></canvas>
<script type="module">
    import { paint } from './paint.js';
    for (const [id, s] of [['b1', 1], ['w1', 1], ['b3', 3], ['w3', 3]]) {
        const c = document.getElementById(id);
        const x = c.getContext('2d');
        x.scale(s, s);
        paint(x, 48, 48);
    }
</script>
