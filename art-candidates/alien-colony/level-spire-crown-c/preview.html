<!doctype html>
<meta charset="utf-8" />
<title>Spire Crown C — preview (1x on black)</title>
<style>
    body {
        background: #000;
        color: #ddd;
        font-family: monospace;
    }
    canvas {
        image-rendering: pixelated;
        border: 1px solid #333;
        margin: 8px;
    }
</style>
<h1>level-spire-crown-c — Spire Crown finale</h1>
<p>
    background-layout (960x270) / platform alloy deck (128x28). Seam strip: bottom row repeats deck
    x4.
</p>
<canvas id="bg" width="960" height="270"></canvas>
<canvas id="deck" width="128" height="28"></canvas>
<div><canvas id="strip" width="512" height="28"></canvas> seam strip</div>
<script type="module">
    import { paint as bg } from './layout.js';
    import { paint as deck } from './deck.js';
    bg(document.getElementById('bg').getContext('2d'), 960, 270);
    deck(document.getElementById('deck').getContext('2d'), 128, 28);
    const s = document.getElementById('strip').getContext('2d');
    for (let i = 0; i < 4; i++) {
        s.save();
        s.translate(i * 128, 0);
        deck(s, 128, 28);
        s.restore();
    }
</script>
