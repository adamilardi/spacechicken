<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Wicket 200 art candidates (1x on black)</title>
        <style>
            body {
                background: #000;
                color: #cfe7ff;
                font-family: monospace;
                margin: 24px;
            }
            figure {
                margin: 0 0 32px;
            }
            img {
                image-rendering: auto;
                max-width: 100%;
            }
            figcaption {
                margin-top: 8px;
            }
            .survivor {
                color: #ffe566;
            }
            .killed {
                color: #8a94a6;
            }
        </style>
    </head>
    <body>
        <h1>Wicket 200 — place directions</h1>
        <figure>
            <img src="direction-a-floodlight-bowl.png" alt="direction A" />
            <figcaption class="survivor">
                A. Floodlight bowl — SURVIVOR. Pylon landmark, asymmetric wash, picket fence.
            </figcaption>
        </figure>
        <figure>
            <img src="direction-b-stands-canyon.png" alt="direction B" />
            <figcaption class="killed">
                B. Stands canyon — KILLED. Reads pagoda; canyon crowds the playfield.
            </figcaption>
        </figure>
        <figure>
            <img src="direction-c-light-rig.png" alt="direction C" />
            <figcaption class="killed">
                C. Light rig diagonals — KILLED. Symmetric X centers dead space; weak landmark.
            </figcaption>
        </figure>
    </body>
</html>
